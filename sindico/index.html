<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CondoGest Angola - Protótipo Multi-Perfil V2</title>
    <!-- Carregamento do Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f7f9fc;
        }
        /* Estilo para links de navegação */
        .nav-link:hover {
            background-color: #dbeafe; /* blue-100 */
            color: #1d4ed8; /* blue-800 */
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Cabeçalho (Header) Fixo -->
    <header class="bg-white shadow-md p-4 flex items-center justify-between sticky top-0 z-10">
        <h1 class="text-xl font-bold text-gray-800">CondoGest <span class="text-blue-600">Angola</span></h1>
        
        <!-- Dropdown para Seleção de Perfil (Simulação) -->
        <div class="relative inline-block text-left">
            <button id="profile-dropdown-btn" class="inline-flex justify-center w-full rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                <span id="current-profile">Síndico</span>
                <!-- Icone de seta para baixo -->
                <svg class="-mr-1 ml-2 h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd" />
                </svg>
            </button>
            <div id="profile-dropdown-menu" class="hidden origin-top-right absolute right-0 mt-2 w-48 rounded-md shadow-lg bg-white ring-1 ring-black ring-opacity-5 focus:outline-none" role="menu" aria-orientation="vertical" aria-labelledby="profile-dropdown-btn">
                <div class="py-1" role="none">
                    <a href="#" class="profile-select block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" data-profile="Síndico">Síndico</a>
                    <a href="#" class="profile-select block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" data-profile="Condómino">Condómino</a>
                    <a href="#" class="profile-select block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" data-profile="Funcionário">Funcionário (Portaria)</a>
                    <a href="#" class="profile-select block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100" data-profile="Fornecedor">Fornecedor</a>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="flex-grow p-4 md:p-6">
        <div class="md:flex md:space-x-6">
            <!-- Sidebar de Navegação (Apenas para Síndico e Condómino) -->
            <nav id="sidebar" class="hidden md:block w-full md:w-64 bg-white p-4 rounded-xl shadow-lg flex-shrink-0 h-fit mb-6 md:mb-0">
                <p class="text-lg font-semibold text-gray-700 mb-3">Menu</p>
                <ul id="profile-nav-links" class="space-y-1">
                    <!-- Links serão preenchidos via JS -->
                </ul>
            </nav>

            <!-- Área de Conteúdo -->
            <div id="content-container" class="flex-grow">
                <!-- Vistas detalhadas serão injetadas aqui -->
            </div>
        </div>
    </main>

    <!-- VISTAS DE CONTEÚDO (Templates para Condómino e Síndico foram expandidos) -->

    <!-- 1. Perfil Síndico (Dashboard Principal) -->
    <template id="view-Síndico-Dashboard">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">Painel Principal (Síndico)</h2>
        
        <!-- Métricas Fictícias (Kz) -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-lg border-l-4 border-blue-500">
                <p class="text-sm font-medium text-gray-500">Saldo Atual (Kz)</p>
                <p class="mt-1 text-3xl font-bold text-blue-600">1.500.000 Kz</p>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-lg border-l-4 border-red-500">
                <p class="text-sm font-medium text-gray-500">Total de Inadimplência</p>
                <p class="mt-1 text-3xl font-bold text-red-600">12%</p>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-lg border-l-4 border-yellow-500">
                <p class="text-sm font-medium text-gray-500">Comunicação Pendente</p>
                <p class="mt-1 text-3xl font-bold text-yellow-600">2</p>
            </div>
        </div>
        
        <!-- Destaque: Ações Rápidas -->
        <h3 class="text-xl font-semibold text-gray-700 mb-4">Ações Rápidas</h3>
        <div class="grid grid-cols-2 gap-4">
            <button class="bg-green-500 hover:bg-green-600 text-white font-semibold p-4 rounded-xl shadow-lg transition duration-150">Enviar Novo Comunicado</button>
            <button class="bg-indigo-500 hover:bg-indigo-600 text-white font-semibold p-4 rounded-xl shadow-lg transition duration-150">Submeter Despesa</button>
        </div>
    </template>

    <!-- 1.1 Perfil Síndico (Gestão de Moradores) -->
    <template id="view-Síndico-Moradores">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">Gestão de Moradores</h2>
        <button class="mb-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-xl transition duration-150 ease-in-out">
            + Cadastrar Novo Morador
        </button>
        <div class="bg-white rounded-xl shadow-lg overflow-x-auto">
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Fração</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nome</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ações</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">402</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">José Eduardo Silva</td>
                        <td class="px-6 py-4 whitespace-nowrap"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Ativo</span></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium"><a href="#" class="text-indigo-600 hover:text-indigo-900">Ver Perfil</a></td>
                    </tr>
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">101B</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">Ana Paula Santos</td>
                        <td class="px-6 py-4 whitespace-nowrap"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Inadimplente</span></td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium"><a href="#" class="text-indigo-600 hover:text-indigo-900">Enviar Aviso</a></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </template>

    <!-- 1.2 Perfil Síndico (Gestão Financeira) -->
    <template id="view-Síndico-Financeiro">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">Gestão Financeira</h2>
        <h3 class="text-xl font-semibold text-gray-700 mb-4">Despesas Pendentes de Aprovação</h3>
        <div class="bg-white rounded-xl shadow-lg overflow-hidden mb-8">
            <ul class="divide-y divide-gray-200">
                <li class="p-4 flex justify-between items-center hover:bg-gray-50">
                    <div>
                        <p class="text-base font-semibold text-gray-900">Fatura: Reparo Elétrico</p>
                        <p class="text-sm text-gray-500">Valor: 150.000 Kz | Fornecedor: EletroAngola</p>
                    </div>
                    <div>
                        <button class="bg-green-500 hover:bg-green-600 text-white text-xs font-semibold py-1 px-3 rounded-full mr-2">Aprovar</button>
                        <button class="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold py-1 px-3 rounded-full">Rejeitar</button>
                    </div>
                </li>
            </ul>
        </div>
        <button class="bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded-xl transition duration-150 ease-in-out">
            Aceder Relatórios Financeiros
        </button>
    </template>

    <!-- 1.3 Perfil Síndico (Comunicação) -->
    <template id="view-Síndico-Comunicacao">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">Comunicação e Reclamações</h2>
        <button class="mb-4 bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-xl transition duration-150 ease-in-out">
            Enviar Novo Aviso Geral
        </button>
        <h3 class="text-xl font-semibold text-gray-700 mb-4">Reclamações em Aberto (2)</h3>
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <ul class="divide-y divide-gray-200">
                <li class="p-4 hover:bg-gray-50">
                    <p class="text-base font-semibold text-gray-900">Falta de água no Bloco A (Urgent)</p>
                    <p class="text-sm text-gray-500">Morador: Fração 205 | Data: 20/11/2025</p>
                    <button class="mt-2 bg-blue-500 hover:bg-blue-600 text-white text-xs font-semibold py-1 px-3 rounded-full">Responder</button>
                </li>
            </ul>
        </div>
    </template>

    <!-- 1.4 Perfil Síndico (Manutenção/OS) - Mantida e integrada com a nova navegação -->
    <template id="view-Síndico-Manutencao">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">Gestão de Manutenção</h2>
        <h3 class="text-xl font-semibold text-gray-700 mb-4">Ordens de Serviço (OS) Abertas</h3>
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <ul class="divide-y divide-gray-200">
                <li class="p-4 flex justify-between items-center hover:bg-gray-50">
                    <div>
                        <p class="text-base font-semibold text-gray-900">Reparo de Elevador (Bloco B)</p>
                        <p class="text-sm text-gray-500">Local: Bloco B, Elevador Social | Status: Pendente</p>
                    </div>
                    <span class="px-3 py-1 text-xs font-medium text-yellow-800 bg-yellow-100 rounded-full">Atribuir</span>
                </li>
                <li class="p-4 flex justify-between items-center hover:bg-gray-50">
                    <div>
                        <p class="text-base font-semibold text-gray-900">Limpeza de Reservatório de Água</p>
                        <p class="text-sm text-gray-500">Local: Casa das Máquinas | Status: Em Curso</p>
                    </div>
                    <span class="px-3 py-1 text-xs font-medium text-blue-800 bg-blue-100 rounded-full">Ver Detalhes</span>
                </li>
            </ul>
        </div>
        <button class="mt-6 bg-gray-500 hover:bg-gray-600 text-white font-bold py-2 px-4 rounded-xl transition duration-150 ease-in-out">
            Configurar Instalações Comuns
        </button>
    </template>


    <!-- 2. Perfil Condómino (Dashboard Principal) -->
    <template id="view-Condómino-Dashboard">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">Área do Condómino (Fração 402)</h2>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div class="bg-white p-5 rounded-xl shadow-lg border-l-4 border-red-500">
                <p class="text-sm font-medium text-gray-500">Quota Pendente</p>
                <p class="mt-1 text-2xl font-bold text-red-600">45.000 Kz</p>
                <span class="text-xs text-gray-500">Vence a 01/12/2025</span>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-lg border-l-4 border-purple-500">
                <p class="text-sm font-medium text-gray-500">Último Comunicado</p>
                <p class="mt-1 text-base font-bold text-purple-600">Aviso sobre manutenção de elevador.</p>
                <span class="text-xs text-gray-500">Há 2 horas</span>
            </div>
            <div class="bg-white p-5 rounded-xl shadow-lg border-l-4 border-yellow-500">
                <p class="text-sm font-medium text-gray-500">Reclamações Ativas</p>
                <p class="mt-1 text-3xl font-bold text-yellow-600">1</p>
            </div>
        </div>
        <button id="nav-pagamentos-condomino-btn" data-view="Condómino-Pagamentos" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-xl transition duration-150 ease-in-out shadow-md">
            Efetuar Pagamento Agora
        </button>
    </template>

    <!-- 2.1 Perfil Condómino (Pagamentos) -->
    <template id="view-Condómino-Pagamentos">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">Pagamentos e Extrato</h2>
        <h3 class="text-xl font-semibold text-gray-700 mb-4">Pagamento Pendente</h3>
        <div class="bg-white p-6 rounded-xl shadow-lg mb-8 border-t-4 border-red-500">
            <p class="text-lg font-bold mb-2">Quota Dezembro: 45.000 Kz</p>
            <p class="text-sm text-gray-600 mb-4">Referência Multicaixa: 123456789</p>
            <button class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-xl transition duration-150 ease-in-out">
                Simular Pagamento (Multicaixa Express)
            </button>
        </div>
        
        <h3 class="text-xl font-semibold text-gray-700 mb-4">Histórico de Transações</h3>
        <div class="bg-white rounded-xl shadow-lg overflow-x-auto">
            <!-- Tabela de extrato mantida do original, garantindo transparência -->
            <table class="min-w-full divide-y divide-gray-200">
                <thead class="bg-gray-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Data</th>
                        <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Valor (Kz)</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">2025-11-01</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-right font-medium text-green-600">45.000</td>
                        <td class="px-6 py-4 whitespace-nowrap text-center"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-green-100 text-green-800">Pago</span></td>
                    </tr>
                    <tr>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">2025-12-01</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-right font-medium text-red-600">45.000</td>
                        <td class="px-6 py-4 whitespace-nowrap text-center"><span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">Pendente</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </template>

    <!-- 2.2 Perfil Condómino (Comunicação) -->
    <template id="view-Condómino-Comunicacao">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">Comunicação e Avisos</h2>
        <h3 class="text-xl font-semibold text-gray-700 mb-4">Avisos Recentes</h3>
        <div class="bg-white rounded-xl shadow-lg overflow-hidden mb-8">
            <ul class="divide-y divide-gray-200">
                <li class="p-4 hover:bg-gray-50">
                    <p class="text-base font-bold text-gray-900">Interrupção Temporária de Água (22/11)</p>
                    <p class="text-sm text-gray-600">A administração informa sobre a manutenção do reservatório.</p>
                    <p class="text-xs text-gray-400 mt-1">20/11/2025</p>
                </li>
                <li class="p-4 hover:bg-gray-50">
                    <p class="text-base font-bold text-gray-900">Convocatória para Assembleia Geral</p>
                    <p class="text-sm text-gray-600">Discussão de novas regras de segurança.</p>
                    <p class="text-xs text-gray-400 mt-1">15/11/2025</p>
                </li>
            </ul>
        </div>
        <button class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-xl transition duration-150 ease-in-out">
            Ver Fórum de Discussão
        </button>
    </template>

    <!-- 2.3 Perfil Condómino (Reclamações) -->
    <template id="view-Condómino-Reclamacoes">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">Reclamações e Ocorrências</h2>
        <button class="mb-4 w-full bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-4 rounded-xl transition duration-150 ease-in-out">
            + Abrir Nova Reclamação
        </button>
        <h3 class="text-xl font-semibold text-gray-700 mb-4">Minhas Reclamações</h3>
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <ul class="divide-y divide-gray-200">
                <li class="p-4 flex justify-between items-center hover:bg-gray-50">
                    <div>
                        <p class="text-base font-semibold text-gray-900">Lâmpada do piso em frente ao 402 queimada</p>
                        <p class="text-sm text-gray-500">Status: Em Análise | Data: 20/11/2025</p>
                    </div>
                    <span class="px-3 py-1 text-xs font-medium text-yellow-800 bg-yellow-100 rounded-full">Ver</span>
                </li>
                <li class="p-4 flex justify-between items-center hover:bg-gray-50">
                    <div>
                        <p class="text-base font-semibold text-gray-900">Ruído excessivo após 22h</p>
                        <p class="text-sm text-gray-500">Status: Resolvida | Data: 10/11/2025</p>
                    </div>
                    <span class="px-3 py-1 text-xs font-medium text-green-800 bg-green-100 rounded-full">Fechada</span>
                </li>
            </ul>
        </div>
    </template>

    <!-- 2.4 Perfil Condómino (Documentos) -->
    <template id="view-Condómino-Documentos">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">Acesso à Informação</h2>
        <h3 class="text-xl font-semibold text-gray-700 mb-4">Documentos do Condomínio</h3>
        <div class="space-y-3">
            <a href="#" class="block bg-white p-4 rounded-xl shadow hover:shadow-md transition duration-150 nav-link flex justify-between items-center">
                <span class="font-medium text-gray-800">Regulamento Interno (PDF)</span>
                <span class="text-blue-500 text-sm">Download</span>
            </a>
            <a href="#" class="block bg-white p-4 rounded-xl shadow hover:shadow-md transition duration-150 nav-link flex justify-between items-center">
                <span class="font-medium text-gray-800">Relatório Financeiro Anual 2024</span>
                <span class="text-blue-500 text-sm">Download</span>
            </a>
            <a href="#" class="block bg-white p-4 rounded-xl shadow hover:shadow-md transition duration-150 nav-link flex justify-between items-center">
                <span class="font-medium text-gray-800">Ata da Última Assembleia</span>
                <span class="text-blue-500 text-sm">Download</span>
            </a>
        </div>
    </template>

    <!-- 3. Perfil Funcionário (Portaria) - Mantida do original -->
    <template id="view-Funcionário-Dashboard">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">Controlo de Portaria/Segurança</h2>

        <!-- Formulário de Registo de Visitantes -->
        <h3 class="text-xl font-semibold text-gray-700 mb-4">Registo Rápido de Visitantes</h3>
        <div class="bg-white p-6 rounded-xl shadow-lg mb-8">
            <form id="visitor-form" class="space-y-4">
                <div>
                    <label for="visitor-name" class="block text-sm font-medium text-gray-700">Nome do Visitante</label>
                    <input type="text" id="visitor-name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border" placeholder="Ex: João Silva" required>
                </div>
                <div>
                    <label for="visitor-unit" class="block text-sm font-medium text-gray-700">Fração de Destino</label>
                    <input type="text" id="visitor-unit" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2 border" placeholder="Ex: 402 ou B-21" required>
                </div>
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-xl transition duration-150 ease-in-out shadow-md">
                    Registar Entrada (Hora Atual)
                </button>
            </form>
        </div>

        <!-- Lista de Visitantes Ativos -->
        <h3 class="text-xl font-semibold text-gray-700 mb-4">Visitantes Ativos</h3>
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <ul class="divide-y divide-gray-200">
                <li class="p-4 flex justify-between items-center hover:bg-gray-50">
                    <div>
                        <p class="text-base font-semibold text-gray-900">Maria Fernandes</p>
                        <p class="text-sm text-gray-500">Destino: 101 | Entrada: 10:30</p>
                    </div>
                    <button class="bg-red-500 hover:bg-red-600 text-white text-xs font-semibold py-1 px-3 rounded-full transition duration-150 ease-in-out">Sair</button>
                </li>
            </ul>
        </div>
    </template>

    <!-- 4. Perfil Fornecedor - Mantida do original -->
    <template id="view-Fornecedor-Dashboard">
        <h2 class="text-2xl font-semibold text-gray-800 mb-6 border-b pb-2">Painel de Fornecedor (Manutenção XYZ)</h2>

        <!-- Ordens de Serviço Atribuídas -->
        <h3 class="text-xl font-semibold text-gray-700 mb-4">Minhas Ordens de Serviço (Pendentes)</h3>
        <div class="space-y-4">
            <div class="bg-white p-5 rounded-xl shadow-lg border-l-4 border-orange-500">
                <p class="text-lg font-semibold text-gray-900">Reparo de Elevador (Bloco B)</p>
                <p class="text-sm text-gray-600 mt-1">Condomínio: Edifício Luanda Sul | Prazo: 25/11/2025</p>
                <div class="mt-3 flex justify-end">
                    <button class="ml-2 bg-green-500 hover:bg-green-600 text-white text-sm font-semibold py-1 px-3 rounded-xl transition duration-150 ease-in-out">
                        Marcar como Concluído
                    </button>
                </div>
            </div>
        </div>
    </template>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const contentContainer = document.getElementById('content-container');
            const dropdownButton = document.getElementById('profile-dropdown-btn');
            const dropdownMenu = document.getElementById('profile-dropdown-menu');
            const currentProfileSpan = document.getElementById('current-profile');
            const profileSelectors = document.querySelectorAll('.profile-select');
            const sidebar = document.getElementById('sidebar');
            const profileNavLinks = document.getElementById('profile-nav-links');

            // Mapeamento de perfis para as vistas iniciais e sub-vistas
            const profileMap = {
                'Síndico': {
                    initialView: 'Dashboard',
                    nav: [
                        { name: 'Dashboard', view: 'Dashboard' },
                        { name: 'Gestão de Moradores', view: 'Moradores' },
                        { name: 'Gestão Financeira', view: 'Financeiro' },
                        { name: 'Comunicação e Reclamações', view: 'Comunicacao' },
                        { name: 'Manutenção e OS', view: 'Manutencao' },
                    ]
                },
                'Condómino': {
                    initialView: 'Dashboard',
                    nav: [
                        { name: 'Dashboard', view: 'Dashboard' },
                        { name: 'Pagamentos e Extrato', view: 'Pagamentos' },
                        { name: 'Comunicação e Avisos', view: 'Comunicacao' },
                        { name: 'Reclamações', view: 'Reclamacoes' },
                        { name: 'Documentos e Regulamentos', view: 'Documentos' },
                    ]
                },
                'Funcionário': { initialView: 'Dashboard' },
                'Fornecedor': { initialView: 'Dashboard' },
            };

            let currentProfile = 'Síndico';
            let currentView = profileMap[currentProfile].initialView;

            // Função para construir a barra lateral
            const buildSidebar = (profile) => {
                const config = profileMap[profile];
                profileNavLinks.innerHTML = '';

                if (config.nav) {
                    sidebar.classList.remove('hidden');
                    config.nav.forEach(item => {
                        const li = document.createElement('li');
                        li.innerHTML = `
                            <a href="#" data-view="${profile}-${item.view}" class="nav-link block p-3 rounded-lg text-sm font-medium transition duration-150 ${item.view === currentView ? 'bg-blue-200 text-blue-800' : 'text-gray-700'}" data-profile="${profile}">
                                ${item.name}
                            </a>
                        `;
                        profileNavLinks.appendChild(li);
                    });
                } else {
                    sidebar.classList.add('hidden');
                }
            };

            // Função para carregar a vista
            const loadView = (profile, view) => {
                const viewId = `${profile}-${view}`;
                const templateId = `view-${viewId}`;
                const template = document.getElementById(templateId);
                
                if (template) {
                    contentContainer.innerHTML = '';
                    const clone = document.importNode(template.content, true);
                    contentContainer.appendChild(clone);
                    currentProfileSpan.textContent = profile;
                    currentProfile = profile;
                    currentView = view;
                    buildSidebar(profile); // Refaz a sidebar para atualizar o estado ativo
                    
                    // Atualiza o estado ativo na barra lateral
                    document.querySelectorAll('.nav-link').forEach(link => {
                        link.classList.remove('bg-blue-200', 'text-blue-800');
                        link.classList.add('text-gray-700');
                        if (link.getAttribute('data-view') === viewId) {
                            link.classList.add('bg-blue-200', 'text-blue-800');
                            link.classList.remove('text-gray-700');
                        }
                    });
                    
                    // Lógica para ligar o botão de 'Pagamentos' do Dashboard Condómino
                    if (viewId === 'Condómino-Dashboard') {
                         document.getElementById('nav-pagamentos-condomino-btn')?.addEventListener('click', (e) => {
                            e.preventDefault();
                            loadView('Condómino', 'Pagamentos');
                        });
                    }

                } else {
                    contentContainer.innerHTML = `<div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative" role="alert"><strong class="font-bold">Erro:</strong><span class="block sm:inline"> Vista não encontrada para ${viewId}.</span></div>`;
                }
            };

            // Event listener para o botão do dropdown
            dropdownButton.addEventListener('click', (e) => {
                e.preventDefault();
                dropdownMenu.classList.toggle('hidden');
            });

            // Event listener para seleção de perfil no dropdown
            profileSelectors.forEach(selector => {
                selector.addEventListener('click', (e) => {
                    e.preventDefault();
                    const profile = e.target.getAttribute('data-profile');
                    const initialView = profileMap[profile].initialView;
                    loadView(profile, initialView);
                    dropdownMenu.classList.add('hidden');
                });
            });

            // Event listener para links da barra lateral
            contentContainer.addEventListener('click', (e) => {
                if (e.target.closest('.nav-link')) {
                    e.preventDefault();
                    const link = e.target.closest('.nav-link');
                    const profile = link.getAttribute('data-profile');
                    const view = link.getAttribute('data-view').split('-').pop();
                    loadView(profile, view);
                }
            });
            
            profileNavLinks.addEventListener('click', (e) => {
                if (e.target.closest('.nav-link')) {
                    e.preventDefault();
                    const link = e.target.closest('.nav-link');
                    const profile = link.getAttribute('data-profile');
                    const view = link.getAttribute('data-view').split('-').pop();
                    loadView(profile, view);
                }
            });

            // Inicializa a aplicação
            loadView(currentProfile, currentView);


            // Função de 'alerta' customizada para evitar window.alert (aqui simulada)
            function customAlert(message) {
                const existingAlert = document.getElementById('custom-alert');
                if (existingAlert) existingAlert.remove();

                const alertDiv = document.createElement('div');
                alertDiv.id = 'custom-alert';
                alertDiv.className = 'fixed top-4 right-4 bg-gray-800 text-white p-4 rounded-lg shadow-xl z-50 transition-opacity duration-300';
                alertDiv.innerHTML = `
                    <p class="font-bold">Aviso do Sistema</p>
                    <p class="text-sm">${message}</p>
                    <button class="absolute top-1 right-2 text-white opacity-70 hover:opacity-100" onclick="document.getElementById('custom-alert').remove()">&times;</button>
                `;
                document.body.appendChild(alertDiv);
                setTimeout(() => {
                    const el = document.getElementById('custom-alert');
                    if (el) {
                         el.style.opacity = '0';
                    }
                    setTimeout(() => document.getElementById('custom-alert')?.remove(), 300);
                }, 4000);
            }

            // Adiciona lógica de submissão do formulário (apenas simulação)
            contentContainer.addEventListener('submit', (e) => {
                if (e.target.id === 'visitor-form') {
                    e.preventDefault();
                    const name = document.getElementById('visitor-name').value;
                    const unit = document.getElementById('visitor-unit').value;
                    if (name && unit) {
                        const message = `Entrada registada: ${name} para a Fração ${unit}. Hora: ${new Date().toLocaleTimeString('pt-AO')}`;
                        customAlert(message);
                        e.target.reset();
                        loadView(currentProfile, currentView); // Recarrega para simular a atualização da lista
                    }
                }
            });
        });
    </script>

</body>
</html>
